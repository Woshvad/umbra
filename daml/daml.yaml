# Umbra — Daml project config, migrated to the Daml 3.4 line for deployment onto
# a real Canton LocalNet (cn-quickstart) via the JSON Ledger API v2.
#
# The previous 2.10.4 `daml start` sandbox config (init-script / parties.json
# export / codegen-js / navigator) is preserved in git history at tag
# `sandbox-mvp`. To restore the one-command sandbox loop:
#   git show sandbox-mvp:daml/daml.yaml > daml/daml.yaml
#
# Templates are LF-standard and compile UNCHANGED on both the 2.x and 3.x lines.
# The only source delta for 3.x is the Daml.Script party allocation
# (`allocatePartyWithHint <displayName> (PartyIdHint h)` → `allocatePartyByHint
# (PartyIdHint h)` — display names were removed in Daml 3.x), in Setup.daml and
# Tests.daml. Verified against cn-quickstart's own 3.4.11 sources
# (Splice.Testing.Utils: `allocatePartyExact = allocatePartyByHint . PartyIdHint`).
sdk-version: 3.4.11
name: umbra
version: 0.1.0
# `source: .` points at the folder CONTAINING `Umbra/` (this daml.yaml lives in
# `daml/`, modules are headered `module Umbra.Asset where` etc.).
source: .
# Bundled with the SDK tarball; resolved automatically — no npm/registry install.
# daml-script is still named `daml-script` on the 3.4 line (verified against
# cn-quickstart/quickstart/daml/licensing-tests/daml.yaml).
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
# DA.Crypto.Text (sha256/toHex) is an ALPHA-flagged daml-stdlib module used by
# CRYP-01's on-ledger commit–reveal binding (OrderCommitment.RevealOrder). It
# works on the pinned SDK 3.4.11 but the stdlib module carries an alpha WARNING;
# suppress ONLY that warning here (honestly labeled alpha — NOT -Werror'd away).
build-options:
  - -Wno-crypto-text-is-alpha
