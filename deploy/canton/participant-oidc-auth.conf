# ============================================================================
# Umbra — Canton participant OIDC auth-config (IDEN-01) — DevNet/prod artifact.
# ============================================================================
#
# DUAL-MODE, HONESTLY LABELED:
#   * DEV (LocalNet, cn-quickstart)  keeps `unsafe-jwt-hmac-256` — the HS256 shared
#     secret `unsafe`, audience https://canton.network.global. UNCHANGED, fast loop.
#     (scripts/localnet/mint-jwt.mjs mints those dev tokens.)
#   * DEVNET/PROD (this file) trusts the Keycloak `umbra` realm via `jwt-jwks`:
#     RS256 tokens verified against the realm's JWKS URL. The ONLY things that change
#     versus dev are the SIGNING ALGORITHM (HS256 -> RS256) and the KEY SOURCE
#     (shared secret -> JWKS). The audience is IDENTICAL, so no claim-shape change.
#
# HOW TO APPLY: merge this into the DevNet participant's Canton config (or, on a Splice
# validator, surface it as AUTH_JWKS_URL + LEDGER_API_AUTH_AUDIENCE — see deploy/README.md).
#
# ── Pitfall 2 (audience XOR scope) ───────────────────────────────────────────
# Configure EXACTLY ONE of the audience option / the scope option. Umbra uses the
# AUDIENCE option below (matches the existing dev-token aud) and relies on the realm's
# default `daml_ledger_api` scope. Setting BOTH makes the participant reject the auth
# config, so the scope-based key is intentionally OMITTED here.
#
# ── Pitfall 3 (sub <-> LEDGER_API_ADMIN_USER) ────────────────────────────────
# Canton derives party rights (actAs/readAs) from the USER identified by the token
# `sub`, NOT from token claims. The umbra-solver service-account `sub` MUST equal the
# participant's LEDGER_API_ADMIN_USER, and THAT user must have been granted the
# operator party's CanActAs/CanReadAs (the grantRights step in the deploy script).
# Otherwise the token verifies but every ledger call 403s. This is the #1 live-UAT
# failure mode — verify it first at the gate.
#
# LIVE token exchange + Canton-accepts-OIDC + live MFA are UAT (needs the Keycloak
# stack booted AND this config applied to a running DevNet participant). Offline, this
# artifact's SHAPE is asserted (jwt-jwks present, canton-audience present, scope key absent).
# ============================================================================

canton.participants.participant.ledger-api {
  auth-services = [
    {
      type            = jwt-jwks
      # Keycloak umbra-realm JWKS endpoint (served through the Caddy dev-TLS proxy).
      url             = "https://keycloak.umbra.dev:8443/realms/umbra/protocol/openid-connect/certs"
      # EXACTLY ONE of the audience / scope options — audience chosen (same as the dev
      # token). Do NOT also add the scope-based key here (Pitfall 2).
      target-audience = "https://canton.network.global"
    }
  ]
}
