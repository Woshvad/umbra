    <rect x="830" y="378" width="370" height="44" fill="#0A0A0A" opacity="0.85"/>
    <text x="850" y="405" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="600" fill="#F4F1EA" letter-spacing="1">HALWARD</text>
    <text x="1180" y="405" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#F4F1EA" opacity="0.6" text-anchor="end" letter-spacing="1">SELLER · SEALED</text>
