  <text x="40" y="212" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="46" fill="#0A0A0A" letter-spacing="-1">EVERYONE'S BLIND.</text>
  <text x="40" y="262" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="46" fill="#0A0A0A" letter-spacing="-1">THAT'S THE POINT.</text>

